name: CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Skill drift check
        run: |
          go run ./tools/skillgen
          git diff --exit-code ../skills/traceway
